<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171917">
<title>Patch Otherwise</title>
<style>
:root{color-scheme:dark;--bg:#171917;--paper:#eae9df;--ink:#232921;--muted:#a2aa9c;--accent:#d7edac}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--paper);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}
main{width:min(100%,750px);min-width:0;padding:36px 24px}
header{margin-bottom:24px}h1{font-size:15px;font-weight:500;letter-spacing:.04em;margin:0 0 8px}header p{font-size:12px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--accent);outline-offset:7px}
.card{appearance:none;-webkit-appearance:none;display:block;position:relative;width:100%;height:420px;margin:0;border:0;padding:0;background:transparent;color:var(--ink);text-align:left;perspective:1400px;border-radius:8px}
.inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.7,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;width:100%;height:100%;background:var(--paper);border-radius:8px;padding:32px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 45px #0002}
.back{transform:rotateY(180deg);background:#dce3d0}
.label,.foot{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;line-height:1.6;color:#5d6756}
.prompt{display:block;font-size:clamp(30px,5.6vw,49px);font-weight:450;line-height:1.14;letter-spacing:-.04em;margin:24px 0;overflow-wrap:break-word}
.detail{display:block;font-size:clamp(19px,3.5vw,25px);font-weight:400;line-height:1.5;letter-spacing:-.02em;margin:20px 0;overflow-wrap:break-word}
.foot{display:flex;justify-content:space-between;gap:16px}.actions{display:flex;justify-content:center;margin-top:26px}
.next{background:none;border:1px solid #50594b;color:var(--paper);border-radius:5px;padding:12px 22px;font-size:13px}.next:hover{background:#252c22;border-color:#80916f}
.hint{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 0;line-height:1.8}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){main{padding:24px 20px}.card{height:440px}.face{padding:26px}.detail{font-size:21px}.prompt{font-size:clamp(27px,8vw,35px)}}
@media(max-width:350px){.card{height:480px}.face{padding:22px}.detail{font-size:19px}.foot{font-size:9px;letter-spacing:.04em}}
@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<main>
<header><h1>Patch Otherwise</h1><p>Strategies for modular synthesis</p></header>
<button type="button" class="card" id="card" aria-label="Flip card" aria-pressed="false">
<span class="inner">
<span class="face front" id="front"><span class="label">A different direction</span><span class="prompt" id="prompt"></span><span class="foot"><span class="number"></span><span>Click to explore ↗</span></span></span>
<span class="face back" id="back" aria-hidden="true"><span class="label">One way into it</span><span class="detail" id="detail"></span><span class="foot"><span class="number"></span><span>Click to return ↶</span></span></span>
</span>
</button>
<div class="actions"><button type="button" class="next" id="next">New card ↗</button></div>
<p class="hint">Click the card to flip · Space for a new card</p>
<div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript><p>This deck needs JavaScript enabled to draw and flip cards.</p></noscript>
</main>
<script>
'use strict';
const cards=[{"prompt": "Modulate your modulator.", "detail": "Change the rate, depth, or shape of a signal that is already creating movement. Let the motion itself evolve."}, {"prompt": "Exchange the source and the destination.", "detail": "Reconsider who is leading. Try reversing the control relationship between two parts, using appropriate inputs and outputs."}, {"prompt": "Let two voices share one control.", "detail": "Send the same gesture to different destinations. Listen for a relationship rather than identical behavior."}, {"prompt": "Interrupt a connection instead of adding one.", "detail": "Remove or mute a control signal. Notice which movements were doing useful work and which were simply keeping things busy."}, {"prompt": "Patch the output back toward the beginning.", "detail": "Explore a feedback path through attenuation. Start with the return at zero and raise it slowly, monitoring at a low level."}, {"prompt": "Put something unexpected under voltage control.", "detail": "Choose a parameter you usually leave fixed. Give it a small amount of movement before trying extremes."}, {"prompt": "Use one signal in two different roles.", "detail": "Let a contour shape both sound and structure, or let a clock influence both rhythm and timbre."}, {"prompt": "Make the voices influence each other.", "detail": "Let an event in one part change another part’s behavior. Aim for a conversation rather than two independent loops."}, {"prompt": "Take the longest route to a simple result.", "detail": "Pass a familiar control through an extra transformation. Keep the detour only if it reveals something worth hearing."}, {"prompt": "Give an unused output a job.", "detail": "Listen to an alternate waveform or try an overlooked control output. Let what is available suggest the next move."}, {"prompt": "Let the slower clock lead.", "detail": "Organize the patch around its longest cycle. Treat faster events as details inside that larger phrase."}, {"prompt": "Remove the downbeat.", "detail": "Mute the event that announces the beginning. Listen for where your sense of the first beat moves."}, {"prompt": "Make one event arrive late.", "detail": "Delay a trigger or shift one step. Use the disagreement to change the feel without rebuilding the pattern."}, {"prompt": "Let a rest become the hook.", "detail": "Create a gap that listeners can anticipate. Protect the absence instead of filling it."}, {"prompt": "Change the rhythm, not the sounds.", "detail": "Leave tuning and timbre alone. Work only with when events happen and how long they remain."}, {"prompt": "Give one voice a different sense of time.", "detail": "Let it pause, drift, or repeat on a different cycle. Keep another element stable enough to reveal the contrast."}, {"prompt": "Repeat until the detail becomes the subject.", "detail": "Hold the larger pattern steady. Listen for tiny differences you would normally overlook."}, {"prompt": "Make the sequence shorter and the evolution longer.", "detail": "Reduce the number of steps. Let slow changes in articulation or timbre provide the longer journey."}, {"prompt": "Let the envelope keep time.", "detail": "Use an end-of-cycle output, if available, to advance or trigger something else. Let the contour’s duration shape the pace."}, {"prompt": "Stop one thing before starting another.", "detail": "Make a clear handoff between parts. Let the change in occupancy become an arrangement gesture."}, {"prompt": "Try a different key.", "detail": "Transpose the musical material while preserving its internal relationships. Listen for a new register or mood, not just a new label."}, {"prompt": "Keep the rhythm. Replace the notes.", "detail": "Preserve the event pattern and articulation. Change only the pitches so you can hear what the rhythm contributes."}, {"prompt": "Hold one note against everything else.", "detail": "Choose a stable reference pitch. Let the moving parts create changing relationships around it."}, {"prompt": "Let the bass choose the harmony.", "detail": "Keep the upper voices in place and change the low note. Listen to how the same material acquires another meaning."}, {"prompt": "Move one voice an octave away.", "detail": "Change register before changing the melody. Listen for separation, weight, or an unexpected collision."}, {"prompt": "Use fewer pitches than you think you need.", "detail": "Remove notes until each remaining pitch has a clear role. Let rhythm and articulation carry more of the interest."}, {"prompt": "Change the intervals, not the root.", "detail": "Keep a tonal anchor while changing the distances around it. Explore a different harmonic character without moving home."}, {"prompt": "Let a melody become a texture.", "detail": "Blur its individual events through overlap, repetition, or processing. Keep a trace of the original contour."}, {"prompt": "Approach a familiar note from an unfamiliar direction.", "detail": "Change the note before the destination, or alter the slide into it. Keep the arrival and reinvent the approach."}, {"prompt": "Leave one voice slightly out of agreement.", "detail": "Try a small tuning or timing offset. Find the point where tension becomes expressive rather than merely distracting."}, {"prompt": "Consider dynamics.", "detail": "Is every event equally important? Change loudness, duration, density, or the space around a sound."}, {"prompt": "Make the loudest sound the rarest.", "detail": "Reserve the strongest accent for an occasional event. Let scarcity give it significance."}, {"prompt": "Shape the ending before the beginning.", "detail": "Focus on release, decay, or the effect tail. Let how a sound leaves determine how it should arrive."}, {"prompt": "Let one voice breathe while another holds.", "detail": "Contrast a changing amplitude contour with a sustained presence. Listen to what each reveals about the other."}, {"prompt": "Make the quietest layer essential.", "detail": "Lower a supporting sound until you almost lose it. Give it a role you notice most clearly when it disappears."}, {"prompt": "Give repetition a changing accent.", "detail": "Keep the events in place while varying their emphasis. Let dynamics redraw the phrase."}, {"prompt": "Use amplitude where you would usually use timbre.", "detail": "Before moving a filter or waveshape, try moving a VCA. Explore whether loudness alone can make the gesture work."}, {"prompt": "Make one gesture smaller.", "detail": "Reduce a modulation range or performance movement. Search for the narrow region where small changes matter."}, {"prompt": "Let the sound disappear before it is finished.", "detail": "Close a VCA or mute a phrase before its expected resolution. Leave the continuation to the listener."}, {"prompt": "Give the background the foreground’s envelope.", "detail": "Apply a related contour to an atmosphere or secondary voice. Let the background reveal the shape of the main event."}, {"prompt": "Listen to the transition, not the destination.", "detail": "Move slowly between two settings. Stop where the passage becomes more interesting than either endpoint."}, {"prompt": "Remove the effect that makes everything sound good.", "detail": "Bypass your most flattering processor. Find out what the underlying patch still needs—or no longer needs."}, {"prompt": "Make the dry sound worth hearing.", "detail": "Temporarily remove ambience and repeats. Work on the source until it has its own reason to exist."}, {"prompt": "Treat noise as a voice.", "detail": "Give noise phrasing, register, and dynamics. Ask it to play a part rather than merely add texture."}, {"prompt": "Move the motion from pitch to timbre.", "detail": "Keep the note steady and redirect the changing contour toward a tone-shaping parameter. Attenuate to suit the new destination."}, {"prompt": "Give the brightest sound the least space.", "detail": "Try a dry, close presentation for the sharpest element. Let other sounds provide the surrounding depth."}, {"prompt": "Build depth without adding another voice.", "detail": "Work with level, register, filtering, or ambience on what is already there. Create distance instead of population."}, {"prompt": "Listen only to what the effect returns.", "detail": "Mute the dry path temporarily. Decide whether the transformed sound could become the main material."}, {"prompt": "Let a resonance become the subject.", "detail": "Find a ringing frequency worth following. Shape the rest of the patch around it, keeping monitoring levels low as resonance rises."}, {"prompt": "Make a harsh sound behave gently.", "detail": "Keep its rough texture but soften its entrance, level, or phrasing. Separate the character of the sound from its behavior."}, {"prompt": "Remove the part you are protecting.", "detail": "Mute the element you believe makes the patch work. Listen for what becomes possible without it."}, {"prompt": "Finish with the modules already patched.", "detail": "Stop looking for another device. Find the missing gesture through the relationships already available."}, {"prompt": "Change only one connection.", "detail": "Choose a cable deliberately. Listen long enough to understand the consequences before changing anything else."}, {"prompt": "Leave the best knob alone.", "detail": "Protect the setting you keep returning to. Develop the patch through a less familiar control."}, {"prompt": "Listen without touching.", "detail": "Let several cycles pass with your hands away. Notice what the patch actually does rather than what you intend to fix."}, {"prompt": "Follow the accident, not the plan.", "detail": "Find one unintended result worth keeping. Let it redirect the patch instead of correcting it immediately."}, {"prompt": "Make the patch playable with one gesture.", "detail": "Choose a control that changes the patch meaningfully. Arrange the surrounding relationships to make that gesture expressive."}, {"prompt": "Record before you understand it.", "detail": "Capture a pass while the patch is still surprising. Understanding can follow the performance."}, {"prompt": "Stop adding. Start arranging.", "detail": "Use entrances, exits, contrasts, and returns. Make a piece from the material already present."}, {"prompt": "End while something is still unresolved.", "detail": "Choose an ending that leaves a little energy in the system. Resist explaining every possibility."}, {"prompt": "Attenuate before you repatch.", "detail": "Reduce the depth of a modulation that feels wrong. The relationship may be useful at a smaller scale."}, {"prompt": "Move the center, not the range.", "detail": "Offset a control signal while keeping its movement similar. Explore a different region of the destination’s response."}, {"prompt": "Invert one relationship.", "detail": "Try an inverted control signal where supported. Let one parameter fall while another rises."}, {"prompt": "Make the modulation audible.", "detail": "Try an audio-rate signal at a suitable modulation input. Begin with low depth and listen to the new spectral detail."}, {"prompt": "Slow it down until it becomes structure.", "detail": "Reduce a repeating movement until it shapes sections rather than individual events. Give it enough time to reveal itself."}, {"prompt": "Sample the movement.", "detail": "Use sample-and-hold to turn a continuous control into steps. Change the sampling rhythm before changing the source."}, {"prompt": "Let chance choose when, not what.", "detail": "Keep a deliberate set of sounds or pitches. Use probability to decide which events are allowed through."}, {"prompt": "Repeat the accident.", "detail": "Capture or recreate an unexpected moment. Find out whether repetition turns it into a recognizable musical idea."}, {"prompt": "Give randomness a boundary.", "detail": "Narrow its voltage range, available pitches, or opportunities to act. Leave room for surprise inside a clear identity."}, {"prompt": "Make one decision permanent.", "detail": "Choose a setting you will not change for the rest of this patch. Let the constraint simplify your next move."}, {"prompt": "Use the opposite waveform.", "detail": "Replace a smooth movement with an abrupt one, or the reverse. Keep the destination and reconsider the shape of its journey."}, {"prompt": "Let the filter articulate.", "detail": "Hold the amplitude more steadily and use the filter contour to shape events. Listen for a different kind of emphasis."}, {"prompt": "Separate attack from decay.", "detail": "Let the beginning and the tail receive different treatment. Try a change that affects one without dominating the other."}, {"prompt": "Make the echo disagree.", "detail": "Choose repeats that resist the main pulse or pitch center. Keep enough stability elsewhere to hear the disagreement clearly."}, {"prompt": "Tune the space.", "detail": "Explore the pitch or color of a resonator, short delay, or reverb. Treat the environment as part of the harmony."}, {"prompt": "Remove the clock.", "detail": "Disconnect the master pulse and listen for another organizing principle. Try manual events, free-running contours, or sustained change."}, {"prompt": "Play the mute.", "detail": "Treat silence as a performance control. Practice a few deliberate removals instead of continuously adjusting parameters."}, {"prompt": "Use the middle of the knob.", "detail": "Move away from the extremes. Find the ambiguous region between two obvious behaviors."}, {"prompt": "Give the patch a horizon.", "detail": "Choose one slow destination for the next few minutes. Let smaller gestures happen inside that larger movement."}, {"prompt": "Let two cycles meet.", "detail": "Use different repeating lengths or rates. Listen for the moments when their relationship briefly becomes clear."}, {"prompt": "Keep the error in tune.", "detail": "Preserve a timing or tonal imperfection while giving it a deliberate musical context. Make the surrounding choices support it."}, {"prompt": "Trade complexity for contrast.", "detail": "Simplify one part so another can become more distinct. Judge the result by clarity rather than activity."}, {"prompt": "Make the transition the performance.", "detail": "Choose two states and spend your attention moving between them. Avoid treating the passage as dead time."}, {"prompt": "Borrow a contour.", "detail": "Take a control shape already doing useful work and apply it elsewhere. Adjust depth and offset for the new destination."}, {"prompt": "Let the silence modulate you.", "detail": "Pause the patch and notice what you expect to hear next. Resume with that expectation in mind—or deliberately deny it."}, {"prompt": "Find the threshold.", "detail": "Explore the point where a small change causes a new behavior. Approach it slowly with conservative output levels."}, {"prompt": "Commit to the first useful sound.", "detail": "Stop auditioning once something suggests a direction. Develop its relationships before searching for a better source."}, {"prompt": "Make room for a hand.", "detail": "Leave one important change unautomated. Give yourself something simple and consequential to perform."}, {"prompt": "Listen from farther away.", "detail": "Change your listening position or lower the monitoring level. Notice which relationships survive the change in perspective."}, {"prompt": "Leave a cable unpatched.", "detail": "Keep one possibility open without using it. Let the patch be complete without exhausting the system."}];
const card=document.getElementById('card'),front=document.getElementById('front'),back=document.getElementById('back');
let bag=[],current=-1,flipped=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function describe(){const c=cards[current];card.setAttribute('aria-pressed',String(flipped));card.setAttribute('aria-label',flipped?`${c.detail} Flip to prompt.`:`${c.prompt} Flip for detail.`);front.setAttribute('aria-hidden',String(flipped));back.setAttribute('aria-hidden',String(!flipped));document.getElementById('announcement').textContent=flipped?c.detail:c.prompt}
function draw(){
 if(!bag.length){bag=shuffle(cards.map((_,i)=>i));if(bag.length>1&&bag[bag.length-1]===current)[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}
 current=bag.pop();flipped=false;
 const inner=card.querySelector('.inner');inner.style.transition='none';card.classList.remove('flipped');
 document.getElementById('prompt').textContent=cards[current].prompt;document.getElementById('detail').textContent=cards[current].detail;
 document.querySelectorAll('.number').forEach(el=>el.textContent=`${String(current+1).padStart(2,'0')} / ${cards.length}`);
 void inner.offsetHeight;inner.style.transition='';describe();
}
card.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flipped',flipped);describe()});
document.getElementById('next').addEventListener('click',draw);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('button,input,textarea,select')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();if(!e.repeat)draw()}});
draw();
</script>
</body>
</html>
